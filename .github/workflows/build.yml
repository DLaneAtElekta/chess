name: Build

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Add Visual Studio C++ tools
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Install .NET Framework targeting packs
      shell: pwsh
      run: |
        # Try installing via Chocolatey's dotnet4.6.2 developer pack which should include 4.0
        choco install netfx-4.6.2-devpack -y

        # If that doesn't work, download and install .NET 4.0 Multi-Targeting Pack directly
        $url = "https://download.microsoft.com/download/4/3/5/43508FFC-B0BD-4949-8B8C-FFFF4A9D7F6A/NDP40-KB2495593-x86-x64-AllOS-ENU.exe"
        $installer = "$env:TEMP\NDP40-TargetingPack.exe"
        try {
          Invoke-WebRequest -Uri $url -OutFile $installer -ErrorAction Stop
          Start-Process -FilePath $installer -Args "/quiet /norestart" -Wait -NoNewWindow
        } catch {
          Write-Host "Direct download failed, continuing..."
        }

    - name: Restore NuGet packages
      run: nuget restore All.sln

    - name: Build solution
      shell: cmd
      run: msbuild All.sln /p:Configuration=Debug /p:Platform="Any CPU" /t:Rebuild /p:DefineConstants="TRACE;DEBUG;CODE_ANALYSIS;_SILENCE_STDEXT_HASH_DEPRECATION_WARNINGS" /maxcpucount

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: chess-build-output
        path: |
          bin/
          debug/
        retention-days: 7
